<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Resource Scheduler</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;margin:20px;background:#f6f7f9;color:#1d2330}
h1{margin:0 0 10px;font-size:20px}
.bar{display:flex;gap:14px;align-items:end;flex-wrap:wrap;margin-bottom:12px}
label{font-size:12px;display:flex;flex-direction:column;gap:2px}
input{width:80px;padding:4px}
button{padding:6px 14px;cursor:pointer}
#err{color:#b00020;min-height:1.2em}
#chart{background:#fff;border:1px solid #d5d9e0;overflow-x:auto}
.cards{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}
.card{background:#fff;border:1px solid #d5d9e0;padding:8px 12px;min-width:100px;font-size:12px}
.card b{display:block;font-size:18px}
table{border-collapse:collapse;background:#fff;font-size:12px}
td,th{border:1px solid #d5d9e0;padding:3px 8px;text-align:right}
.legend{margin:8px 0}
.legend span{display:inline-block;margin-right:10px;font-size:12px}
.legend i{display:inline-block;width:12px;height:12px;vertical-align:middle;margin-right:3px}
</style></head><body>
<h1>Resource Scheduler: priority queue on machines</h1>
<div class="bar">
<label>Jobs<input id="n" type="number" value="24" min="0" max="500"></label>
<label>Machines<input id="m" type="number" value="3" min="1" max="32"></label>
<label>Seed<input id="seed" type="number" value="1" min="0"></label>
<button id="go">Schedule</button></div>
<div id="err"></div>
<div class="cards" id="cards"></div>
<div class="legend" id="legend"></div>
<div id="chart"></div>
<h3>Jobs in start order</h3>
<table id="tbl"></table>
<script>
const COL=["#d62728","#ff7f0e","#2ca02c","#1f77b4","#9467bd"];
const NAME=["P0 urgent","P1 high","P2 normal","P3 low","P4 batch"];
const $=id=>document.getElementById(id);
function svgChart(d){
  const L=50,R=20,T=28,RH=34,span=Math.max(d.metrics.makespan,1);
  const W=Math.max(900,span*18+L+R), H=T+d.machines.length*RH+10, sx=(W-L-R)/span;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" font-size="11" font-family="system-ui">`;
  const step=span>120?20:span>50?10:5;
  for(let t=0;t<=span;t+=step){const x=L+t*sx;
    s+=`<line x1="${x}" y1="${T-6}" x2="${x}" y2="${H-6}" stroke="#e3e6ec"/><text x="${x}" y="${T-12}" text-anchor="middle">${t}</text>`;}
  d.machines.forEach((m,i)=>{s+=`<text x="6" y="${T+i*RH+20}">${m}</text>`;});
  d.slots.forEach(sl=>{const i=d.machines.indexOf(sl.machine),x=L+sl.start*sx,w=(sl.end-sl.start)*sx;
    s+=`<g><title>${sl.job_id} P${sl.priority} arrive ${sl.arrival} start ${sl.start} end ${sl.end} wait ${sl.wait}</title>`+
       `<rect x="${x}" y="${T+i*RH+2}" width="${Math.max(w-1,1)}" height="${RH-8}" fill="${COL[sl.priority]}" rx="2"/>`+
       `<text x="${x+3}" y="${T+i*RH+21}" fill="#fff">${w>=40?sl.job_id:''}</text></g>`;});
  return s+"</svg>";
}
async function run(){
  $("err").textContent="";
  const q=`n=${$("n").value}&machines=${$("m").value}&seed=${$("seed").value}`;
  const r=await fetch("/api/schedule?"+q), d=await r.json();
  if(!r.ok){$("err").textContent=d.error;return;}
  const m=d.metrics;
  $("cards").innerHTML=[["Jobs",m.jobs],["Makespan",m.makespan],["Avg wait",m.avg_wait],["Max wait",m.max_wait]]
    .concat(Object.entries(m.avg_wait_by_priority).map(([p,v])=>["Avg wait P"+p,v]))
    .concat(Object.entries(m.utilization).map(([k,v])=>["Util "+k,(v*100).toFixed(0)+"%"]))
    .map(([a,b])=>`<div class="card">${a}<b>${b}</b></div>`).join("");
  $("legend").innerHTML=NAME.map((n,i)=>`<span><i style="background:${COL[i]}"></i>${n}</span>`).join("");
  $("chart").innerHTML=svgChart(d);
  $("tbl").innerHTML="<tr><th>Job</th><th>Machine</th><th>Pri</th><th>Arrive</th><th>Start</th><th>End</th><th>Wait</th></tr>"+
    d.slots.map(s=>`<tr><td>${s.job_id}</td><td>${s.machine}</td><td>${s.priority}</td><td>${s.arrival}</td><td>${s.start}</td><td>${s.end}</td><td>${s.wait}</td></tr>`).join("");
}
$("go").onclick=run;run();
</script></body></html>
